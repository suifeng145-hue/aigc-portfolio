<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>温健锋 | 代表作品</title>
    <meta
      name="description"
      content="温健锋的作品集网站，展示商业落地项目、代表作品、其他作品和联系方式。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Noto+Serif+SC:wght@500;700&family=Source+Han+Sans+SC:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css?v=20260604-responsive-fix-2" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand" href="#home" data-site-name>WEN JIANFENG</a>
      <nav aria-label="主导航">
        <a href="#commercial">商业落地项目</a>
        <a href="#representative-works">代表作品</a>
        <a href="#other-works">其他作品</a>
        <a href="#contact">联系</a>
      </nav>
    </header>

    <main>
      <section class="hero" id="home" aria-label="首页">
        <img class="hero-bg" src="assets/images/hero-ai-portfolio.png" alt="" />
        <canvas class="hero-particles" data-hero-particles aria-hidden="true"></canvas>
        <div class="hero-fluid fluid-a" aria-hidden="true"></div>
        <div class="hero-fluid fluid-b" aria-hidden="true"></div>
        <div class="hero-scan" aria-hidden="true"></div>
        <div class="hero-overlay"></div>
        <div class="hero-copy reveal" data-hero-copy>
          <p class="eyebrow" data-role>AIGC影视创作者</p>
          <h1 data-person-name>温健锋</h1>
          <p class="hero-line" data-hero-line>
            熟练使用多种AI视频模型与生图模型，具备商业视频项目落地经验，熟练使用AI视频工作流。
          </p>
        </div>
        <div class="hero-meta">
          <span data-years>2025-2026</span>
        </div>
      </section>

      <section class="section works reveal" id="commercial">
        <div class="section-label">
          <span>[ 01 / 商业落地项目 ]</span>
        </div>
        <h2 class="section-title">商业落地项目</h2>
        <div class="project-list" data-commercial-grid></div>
      </section>

      <section class="section works reveal" id="representative-works">
        <div class="section-label">
          <span>[ 02 / 代表作品 ]</span>
        </div>
        <h2 class="section-title">代表作品</h2>
        <div class="project-list" data-representative-works-grid data-archive-grid></div>
      </section>

      <section class="section works reveal" id="other-works">
        <div class="section-label">
          <span>[ 03 / 其他作品 ]</span>
        </div>
        <h2 class="section-title">其他作品</h2>
        <div class="project-list" data-other-works-grid data-archive-grid></div>
      </section>

      <section class="section contact reveal" id="contact">
        <div class="section-label">
          <span>[ 04 / 联系 ]</span>
        </div>
        <h2 class="section-title">联系我</h2>
        <div class="contact-card">
          <p data-contact-text>欢迎联系我查看完整作品、项目素材或进一步沟通。</p>
          <div class="contact-links" data-contact-links></div>
        </div>
      </section>

      <section class="thanks reveal" aria-label="感谢页">
        <img class="thanks-bg" src="assets/images/hero-ai-portfolio.png" alt="" />
        <div class="thanks-overlay"></div>
        <div class="thanks-copy">
          <p>代表作品集</p>
          <h2>THANKS</h2>
          <span>WEN JIANFENG / 2025-2026</span>
        </div>
      </section>
    </main>

    <section class="work-detail-page" data-work-detail hidden></section>

    <script src="content.js?v=20260604-responsive-fix-2"></script>
    <script src="script.js?v=20260604-responsive-fix-2"></script>
  </body>
</html>
